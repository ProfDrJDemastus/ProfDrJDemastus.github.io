name: Article 03 search monitor

on:
  schedule:
    - cron: "47 5 * * 1"   # Mondays 05:47 UTC, after the strong sustainability watch
  workflow_dispatch:
  push:
    branches: [main]
    paths:   # rerun whenever the search itself changes
      - "article-03-watch/config/**"
      - "article-03-watch/sweep.py"
      - ".github/workflows/article-03-watch.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: site-data-sweeps
  cancel-in-progress: false

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Search OpenAlex
        env:
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
        run: python3 article-03-watch/sweep.py

      - name: Save results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add article-03-watch/data
          if git diff --cached --quiet; then
            echo "No changes to save."
            exit 0
          fi
          git commit -m "Article 03 search $(date -u +%Y-%m-%d)"
          git pull --rebase origin main
          git push

      - name: Rebuild the site
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" --silent
