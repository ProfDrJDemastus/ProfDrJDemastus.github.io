<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Classroom Games</title>
<style>
  body {
    margin: 0;
    background: #f4f6f8;
    color: #14202b;
    font: 18px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  main { max-width: 640px; margin: 0 auto; padding: 3rem 1rem; }
  h1 { font-size: 1.8rem; margin: 0 0 1.5rem; }
  a.card {
    display: block;
    padding: 1rem 1.2rem;
    background: #fff;
    border: 1px solid #d7dee4;
    border-radius: 14px;
    color: inherit;
    text-decoration: none;
  }
  a.card:hover { border-color: #0b6e99; }
  a.card b { color: #0b6e99; font-size: 1.15rem; }
  a.card span { display: block; color: #5b6b78; font-size: .95rem; margin-top: .2rem; }
</style>
</head>
<body>
<main>
  <h1>Classroom Games</h1>
  <a class="card" href="commons/">
    <b>Tragedy of the Commons</b>
    <span>A four-team game on sharing a renewable resource, for exploring Hardin and Ostrom in class.</span>
  </a>
</main>
</body>
</html>
